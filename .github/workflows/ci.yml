name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Biome lint + format check
        run: npm run lint

      - name: Astro type-check
        run: npm run check

      - name: Cross-collection ref check
        run: npm run check:refs

      - name: Secret-leak scan
        run: npm run check:leaks

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Content-drift guard
        # Ensure every public content entry actually emits a page.
        # Fails CI when a new dish/farm/recipe was added but the build can't produce it.
        run: |
          set -euo pipefail
          for kind in dishes farms recipes restaurants; do
            src=$(find "src/content/$kind" -mindepth 1 -maxdepth 1 \( -type d -o -name '*.mdx' \) | wc -l | tr -d ' ')
            built=$(find "dist/$kind" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "$kind: src=$src built=$built"
            if [ "$built" -lt "$src" ]; then
              echo "::error::$kind drift: $built of $src entries built"
              exit 1
            fi
          done

      - name: Editorial + design audits (advisory)
        # Run every audit script as an advisory check — never fails CI.
        # Each script is read-only; output goes to the workflow log.
        # See docs/adr/0009-0013 for the canon each one polices.
        continue-on-error: true
        run: |
          set +e
          echo "::group::audit:lineage (ADR-0009 north star)"
          npm run audit:lineage 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:tags"
          npm run audit:tags 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:coords"
          npm run audit:coords 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:tokens (ADR-0010 visual)"
          npm run audit:tokens 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:radii (ADR-0010 radii)"
          npm run audit:radii 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:motion (ADR-0011 motion)"
          npm run audit:motion 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:prose (ADR-0012 voice)"
          npm run audit:prose 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::audit:a11y (ADR-0013 accessibility)"
          npm run audit:a11y 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload dist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=foodbook --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
