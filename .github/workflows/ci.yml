name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Biome lint + format check
        run: npm run lint

      - name: Astro type-check
        run: npm run check

      - name: Cross-collection ref check
        run: npm run check:refs

      - name: Secret-leak scan
        run: npm run check:leaks

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Content-drift guard
        # Ensure every public content entry actually emits a page.
        # Fails CI when a new dish/farm/recipe was added but the build can't produce it.
        run: |
          set -euo pipefail
          for kind in dishes farms recipes restaurants; do
            src=$(find "src/content/$kind" -mindepth 1 -maxdepth 1 \( -type d -o -name '*.mdx' \) | wc -l | tr -d ' ')
            built=$(find "dist/$kind" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "$kind: src=$src built=$built"
            if [ "$built" -lt "$src" ]; then
              echo "::error::$kind drift: $built of $src entries built"
              exit 1
            fi
          done

      - name: Upload dist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.110.0 pages deploy dist --project-name=foodbook --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
