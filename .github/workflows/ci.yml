name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Biome lint + format check
        run: npm run lint

      - name: Astro type-check
        run: npm run check

      - name: Cross-collection ref check
        run: npm run check:refs

      - name: Secret-leak scan
        run: npm run check:leaks

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Content-drift guard
        # Ensure every public content entry actually emits a page.
        # Fails CI when a new dish/farm/recipe was added but the build can't produce it.
        run: |
          set -euo pipefail
          for kind in dishes farms recipes restaurants; do
            src=$(find "src/content/$kind" -mindepth 1 -maxdepth 1 \( -type d -o -name '*.mdx' \) | wc -l | tr -d ' ')
            built=$(find "dist/$kind" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "$kind: src=$src built=$built"
            if [ "$built" -lt "$src" ]; then
              echo "::error::$kind drift: $built of $src entries built"
              exit 1
            fi
          done

      # Deploy the exact dist/ verified above, from this same workspace.
      # The previous shape (upload dist → separate deploy job downloads
      # it) fails whenever the ACCOUNT-wide Actions artifact storage
      # quota is exhausted (2026-07-20/22 incident, first seen on
      # researchbook) — the quota is shared across all repos and with
      # GitHub Packages, so this repo can be broken by another repo's
      # storage. Inlining removes the artifact dependency entirely.
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx wrangler pages deploy dist --project-name=foodbook --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
